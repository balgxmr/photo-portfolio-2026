<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>José Encalada | Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./assets/style.css" />
  </head>

  <body>
    <!-- NAV -->
    <nav class="navbar">
      <h1 class="brand">José Encalada</h1>
      <ul class="nav-links">
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#cars">Cars</a></li>
        <li><a href="#contact">Contacto</a></li>
      </ul>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <div class="hero-container">
        <div class="hero-image">
          <img src="./assets/img/pfp.jpg" alt="José Encalada" />
        </div>

        <div class="hero-content">
          <h2>José Encalada</h2>
          <p>Fotógrafo — Panamá</p>
          <a href="#contact" class="btn">CONTÁCTAME</a>
        </div>
      </div>
    </header>

    <!-- PORTFOLIO -->
    <section id="portfolio" class="portfolio-section reveal">
      <h3 class="section-title">Principales</h3>
      <div class="gallery">
        <div class="photo">
          <img src="./assets/img/IMG_1059-Enhanced-NR-2024.jpg" alt="" />
        </div>
        <div class="photo">
          <img src="./assets/img/IMG_1951-2025.jpg" alt="" />
        </div>
        <div class="photo">
          <img src="./assets/img/IMG_0459-2024.jpg" alt="" />
        </div>
      </div>
    </section>

    <!-- CAR PHOTOGRAPHY -->
    <section id="cars" class="portfolio-section reveal">
      <h3 class="section-title">Car Photography</h3>
      <div class="gallery">
        <div class="photo">
          <img src="./assets/img/IMG_2569.jpg" alt="" />
        </div>
        <div class="photo">
          <img src="./assets/img/IMG_2579.jpg" alt="" />
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact-section reveal">
      <h3 class="section-title">Contáctame</h3>

      <div class="contact-box">
        <p>
          <strong>WhatsApp:</strong>
          <a href="https://wa.me/50763101101" target="_blank"> +507 6310-1101 </a>
        </p>

        <p>
          <strong>Email:</strong>
          <a href="mailto:tuemail@email.com"> jose.encalada1407@gmail.com </a>
        </p>

        <p><strong>Ubicación:</strong> Panamá, Ciudad de Panamá</p>
      </div>
    </section>

    <footer>
      <p>José Encalada - 2026</p>
    </footer>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
      <span class="close">&times;</span>
      <img class="lightbox-img" src="" alt="" />
    </div>

    <script src="main.js"></script>
  </body>
</html>
